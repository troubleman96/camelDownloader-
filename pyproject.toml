[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camelDownloader"
version = "3.0.1"
description = "General Purpose Downloader — HTTP, YouTube/media, Torrents"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "yt-dlp>=2025.01.01",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
camel = "camel_downloader.main:main"

[tool.setuptools.packages.find]
where = ["src"]
